<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimizo — tipografías candidatas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Urbanist:wght@300;400;500;600;700;800&family=Gabarito:wght@400;500;600;700;800&family=Kumbh+Sans:wght@300;400;500;600;700;800&family=League+Spartan:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@300;400;500;600;700;800&family=Figtree:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --menta: #91CEC4; --teal: #59BDB1; --teal-prof: #387E80;
    --grafito: #424E4E; --navy: #26405B; --hueso: #EDEEE8;
    --peso: 800; --track: 0em;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--hueso); color: var(--navy); font: 15px/1.5 system-ui, sans-serif; padding: 40px 16px 80px; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 28px; }
  h1 { font-size: 28px; letter-spacing: -0.01em; }
  header p { color: var(--grafito); max-width: 60ch; margin-top: 6px; }
  .ctrl { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--grafito); }
  .seg { display: inline-flex; background: #fff; border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; font: inherit; padding: 6px 12px; border-radius: 999px; cursor: pointer; color: var(--grafito); }
  .seg button[aria-pressed="true"] { background: var(--navy); color: var(--hueso); }

  /* Comparación rápida: todos los logos uno bajo otro */
  .tira { background: #fff; border-radius: 20px; padding: 8px 0; margin-bottom: 36px; }
  .fila { display: grid; grid-template-columns: 190px 1fr; align-items: center; gap: 16px; padding: 10px 24px; }
  .fila + .fila { border-top: 1px solid #EEF0EC; }
  .fila .nom { font-size: 13px; color: var(--grafito); }
  .fila .nom b { display: block; color: var(--navy); font-size: 15px; }
  .fila.ref .nom b::after { content: " · referencia"; font-weight: 400; color: var(--teal-prof); }
  .fila.ref img { height: 72px; }

  .lockup { display: flex; align-items: center; position: relative; }
  .lockup img.iso { display: block; flex: none; }
  .lockup .wm { white-space: nowrap; font-weight: var(--peso); letter-spacing: var(--track); line-height: 1; position: relative; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
  .card { background: #fff; border-radius: 22px; overflow: hidden; }
  .card .top { padding: 28px 28px 22px; }
  .card .dark { background: var(--navy); padding: 18px 28px; }
  .card .dark .wm { color: var(--hueso); }
  .card .body { padding: 22px 28px 28px; display: grid; gap: 14px; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--grafito); margin-bottom: 18px; }
  .meta b { font-size: 16px; color: var(--navy); }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #EAF5F3; color: var(--teal-prof); }
  .tag.warn { background: #F6EFE6; color: #8A5A22; }
  .eyebrow { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--grafito); }
  .eyebrow i { width: 10px; height: 10px; border-radius: 50%; background: var(--teal); }
  .h { font-size: 27px; line-height: 1.12; font-weight: var(--peso); letter-spacing: -0.01em; }
  .p { font-size: 15px; line-height: 1.5; color: var(--grafito); font-weight: 400; }
  .pil { display: flex; flex-wrap: wrap; gap: 6px 14px; font-weight: 600; font-size: 14px; }
  .pil span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); margin-right: 7px; vertical-align: middle; }
  .form { display: flex; gap: 8px; }
  .form input { flex: 1; min-width: 0; font: inherit; font-size: 14px; border: 1.5px solid #DDE2DE; border-radius: 12px; padding: 10px 12px; color: var(--navy); background: #FAFBF8; }
  .form button { font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 12px; padding: 10px 16px; background: var(--navy); color: var(--hueso); }
  .abc { font-size: 14px; color: var(--grafito); word-break: break-all; }
  .abc .w { color: var(--navy); }
  @media (max-width: 640px) {
    .fila { grid-template-columns: 1fr; gap: 6px; padding: 14px 16px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Tipografías candidatas para Optimizo</h1>
      <p>Reemplazo de Made Tommy por una tipografía con licencia abierta (OFL: uso comercial libre, web y apps incluidas). El isotipo es el vector original; solo cambia la letra.</p>
    </div>
    <div class="ctrl">
      <span>Peso <span class="seg" data-var="--peso"><button data-v="600">600</button><button data-v="700">700</button><button data-v="800" aria-pressed="true">800</button></span></span>
      <span>Espaciado <span class="seg" data-var="--track"><button data-v="-0.03em">−3</button><button data-v="-0.015em">−1,5</button><button data-v="0em" aria-pressed="true">0</button><button data-v="0.015em">+1,5</button></span></span>
    </div>
  </header>

  <section class="tira" id="tira"></section>
  <section class="grid" id="grid"></section>
</div>

<script>
const FUENTES = [
  { f: 'Outfit',            nota: 'Geométrica redonda, la más cercana en espíritu', tag: 'recomendada' },
  { f: 'Kumbh Sans',        nota: 'Geométrica, «t» y «m» muy parecidas a Tommy' },
  { f: 'League Spartan',    nota: 'Geométrica pesada, más carácter, más ancha' },
  { f: 'Urbanist',          nota: 'Geométrica limpia y moderna' },
  { f: 'Gabarito',          nota: 'Geométrica amable, peso muy firme' },
  { f: 'Lexend',            nota: 'Ancha y muy legible (pensada para lectura)' },
  { f: 'Plus Jakarta Sans', nota: 'Moderna y premium, menos redonda' },
  { f: 'Sora',              nota: 'Tecnológica, ancha, con más personalidad' },
  { f: 'Figtree',           nota: 'Limpia y amistosa, muy buena en texto' },
  { f: 'Poppins',           nota: 'La más parecida a Tommy, pero la más usada del mundo', tag: 'genérica', warn: true },
];
const ISO = 'ref/isotipo.svg';

// Arma un lockup donde la altura de «x» = 25 % del isotipo y queda centrada en él (como el logo original).
function lockup(fuente, H, color) {
  const el = document.createElement('div');
  el.className = 'lockup';
  el.innerHTML = `<img class="iso" src="${ISO}" alt="" style="height:${H}px"><span class="wm">optimizo</span>`;
  const wm = el.querySelector('.wm');
  wm.style.fontFamily = `'${fuente}'`;
  if (color) wm.style.color = color;
  el.dataset.f = fuente; el.dataset.h = H;
  return el;
}
function ajustar(el) {
  const f = el.dataset.f, H = +el.dataset.h;
  const peso = getComputedStyle(document.documentElement).getPropertyValue('--peso').trim();
  const c = document.createElement('canvas').getContext('2d');
  c.font = `${peso} 100px '${f}'`;
  const mo = c.measureText('o');
  const xh = (mo.actualBoundingBoxAscent + mo.actualBoundingBoxDescent) / 100; // alto de la «o» por px de fuente
  const size = (H * 0.255) / xh;   // medido en el logo original: «o» ≈ 25 % del isotipo (calibrado contra la captura)
  const wm = el.querySelector('.wm');
  wm.style.fontSize = size + 'px';
  // separación medida en el original (29 % del isotipo), descontando el margen interno de la «o»
  wm.style.marginLeft = (H * 0.27 + mo.actualBoundingBoxLeft / 100 * size) + 'px';
  // centra la x en el centro del isotipo: baseline queda a H/2 + xh/2
  const asc = c.measureText('x').fontBoundingBoxAscent / 100 * size;
  const desc = c.measureText('x').fontBoundingBoxDescent / 100 * size;
  const baselineEnCaja = asc;                       // con line-height 1 la caja mide asc+desc aprox.
  const alto = asc + desc;
  const deseado = H / 2 + (mo.actualBoundingBoxAscent / 100 * size) - (H * 0.255) / 2; // centro de la «o» = centro del isotipo
  const actual = (H - alto) / 2 + baselineEnCaja;   // baseline con align-items:center
  wm.style.top = (deseado - actual) + 'px';
}

const tira = document.getElementById('tira');
tira.innerHTML = `<div class="fila ref"><div class="nom"><b>Made Tommy</b>original · licencia pagada</div><img src="ref/logo-made-tommy-2.png" alt="Logo original"></div>`;
const grid = document.getElementById('grid');
const todos = [];

FUENTES.forEach(({ f, nota, tag, warn }) => {
  const fila = document.createElement('div');
  fila.className = 'fila';
  fila.innerHTML = `<div class="nom"><b>${f}</b>Google Fonts · OFL</div>`;
  const l1 = lockup(f, 72); fila.appendChild(l1); tira.appendChild(fila); todos.push(l1);

  const card = document.createElement('article');
  card.className = 'card';
  card.style.fontFamily = `'${f}'`;
  card.innerHTML = `
    <div class="top"><div class="meta"><b>${f}</b>${tag ? `<span class="tag${warn ? ' warn' : ''}">${tag}</span>` : ''}</div></div>
    <div class="dark"></div>
    <div class="body">
      <div class="eyebrow"><i></i>Partner de transformación digital</div>
      <div class="h">Soluciones tecnológicas que optimizan tu empresa</div>
      <div class="p">Te acompañamos en la transformación digital de tu negocio, optimizando y rentabilizando tus operaciones.</div>
      <div class="pil"><span>Optimizo Recursos</span><span>Optimizo Tiempo</span><span>Optimizo Procesos</span></div>
      <div class="form"><input value="contacto@empresa.cl" aria-label="Correo"><button>Agendar diagnóstico</button></div>
      <div class="abc"><span class="w">Aa Bb Cc Ññ Óó</span> abcdefghijklmnopqrstuvwxyz 0123456789 · ${nota}</div>
    </div>`;
  const l2 = lockup(f, 84); card.querySelector('.top').appendChild(l2); todos.push(l2);
  const l3 = lockup(f, 44); card.querySelector('.dark').appendChild(l3); todos.push(l3);
  grid.appendChild(card);
});

function ajustarTodo() { todos.forEach(ajustar); }
document.fonts.ready.then(() => Promise.all(FUENTES.flatMap(({ f }) => [600, 700, 800].map(w => document.fonts.load(`${w} 40px '${f}'`))))).then(ajustarTodo);

document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  document.documentElement.style.setProperty(seg.dataset.var, b.dataset.v);
  ajustarTodo();
}));
</script>
</body>
</html>
