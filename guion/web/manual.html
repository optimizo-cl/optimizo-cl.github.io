<style>
  @page { size: A4 landscape; margin: 0; }
  html, body { background: var(--hueso); }
  body::before, .mate::before, .lamina::before { display: none !important; }
  .hoja { width: 297mm; min-height: 210mm; padding: 16mm 18mm; break-after: page; display: grid; align-content: start; gap: 8mm; position: relative; }
  .hoja .seccion { padding: 0; border: 0; }
  .hoja .seccion__cuerpo { zoom: .66; }
  .hoja:has(#manual-logo) .seccion__cuerpo, .hoja:has(#tipografia) .seccion__cuerpo { zoom: .5; }
  .hoja { height: 210mm; overflow: hidden; }
  .hoja .seccion__cabeza { margin-bottom: 6mm; }
  .hoja .titulo-1 { font-size: 30pt; }
  .hoja__pie { position: absolute; left: 18mm; right: 18mm; bottom: 10mm; display: flex; justify-content: space-between; font-size: 8pt; color: var(--texto-3); }
  .tapa { position: relative; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 12mm; height: 210mm; padding: 0 22mm; break-after: page; overflow: hidden; border-radius: 0 !important; color: var(--hueso); }
  .tapa .isotipo { width: 112mm; filter: drop-shadow(0 6mm 6mm rgba(0, 0, 0, .35)) drop-shadow(0 .6mm .6mm rgba(0, 0, 0, .3)); }
  .tapa h1 { font-size: 46pt; font-weight: 700; letter-spacing: -0.045em; line-height: .98; }
  .tapa .ceja { color: var(--acento-claro); }
  .tapa .tapa__pie { position: absolute; left: 22mm; right: 22mm; bottom: 12mm; display: flex; justify-content: space-between; font-size: 8pt; opacity: .7; }
  .divisor { height: 210mm; break-after: page; display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 10mm; padding: 0 22mm 26mm; background: var(--superficie-hundida); }
  .divisor__n { font-size: 190pt; font-weight: 700; line-height: .78; letter-spacing: -0.07em; color: transparent; -webkit-text-stroke: 1.2pt var(--borde-fuerte); }
  .divisor h2 { font-size: 40pt; font-weight: 700; letter-spacing: -0.045em; line-height: 1; padding-bottom: 6mm; }
  .hoja .pieza__pestanas { display: none !important; }
  .hoja .construccion2 * { transition: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; }
  .hoja .mov2__t i { width: var(--w) !important; transition: none !important; }
  .hoja:has(#manual-logo) .seccion__cuerpo { zoom: .62 !important; }
  .hoja:has(#movimiento-spec) .seccion__cuerpo { zoom: .5 !important; }
  .ficha, .dock, .nav-pie .ejemplo { display: none !important; }
  * { animation: none !important; transition: none !important; }
  .mate { box-shadow: inset 0 0 0 1px var(--borde) !important; }
</style>
