<!doctype html>
<html lang="es" data-paleta="teal" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimizo — Manual de marca</title>
<link rel="stylesheet" href="../tokens/optimizo.css">
<link rel="stylesheet" href="../estilos/base.css">
<link rel="stylesheet" href="../estilos/movimiento.css">
<link rel="stylesheet" href="../estilos/kit.css">
<link rel="stylesheet" href="../estilos/kit-piezas.css">
<link rel="stylesheet" href="../estilos/guion.css">
<link rel="stylesheet" href="../estilos/patrones.css">
<link rel="stylesheet" href="../estilos/datos.css">
<link rel="stylesheet" href="../estilos/producto.css">
<link rel="stylesheet" href="../estilos/web.css">
<link rel="stylesheet" href="../estilos/manual.css">
<link rel="stylesheet" href="../estilos/secciones.css">
<style>
  @page { size: A4 landscape; margin: 0; }
  html, body { background: var(--hueso); }
  body::before, .mate::before, .lamina::before { display: none !important; }
  .hoja { width: 297mm; min-height: 210mm; padding: 16mm 18mm; break-after: page; display: grid; align-content: start; gap: 8mm; position: relative; }
  .hoja .seccion { padding: 0; border: 0; }
  .hoja .seccion__cuerpo { zoom: .66; }
  .hoja:has(#manual-logo) .seccion__cuerpo, .hoja:has(#tipografia) .seccion__cuerpo { zoom: .5; }
  .hoja { height: 210mm; overflow: hidden; }
  .hoja .seccion__cabeza { margin-bottom: 6mm; }
  .hoja .titulo-1 { font-size: 30pt; }
  .hoja__pie { position: absolute; left: 18mm; right: 18mm; bottom: 10mm; display: flex; justify-content: space-between; font-size: 8pt; color: var(--texto-3); }
  .tapa { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 12mm; min-height: 210mm; padding: 0 22mm; break-after: page; }
  .tapa .isotipo { width: 120mm; }
  .tapa h1 { font-size: 46pt; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .ficha, .dock, .nav-pie .ejemplo { display: none !important; }
  * { animation: none !important; transition: none !important; }
  .mate { box-shadow: inset 0 0 0 1px var(--borde) !important; }
</style>
<script type="module" src="manual.js"></script>
</head>
<body><main id="manual"></main></body>
</html>
